<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Rig Ultra Transaction</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #6c8cff;
    --common: #8a8f98;
    --uncommon: #4caf7d;
    --rare: #3a8dde;
    --legendary: #d9a641;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
  }
  .toolbar select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  .selected-count {
    margin-left: auto;
    font-size: 14px;
    color: var(--muted);
  }
  .selected-count strong { color: var(--text); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s ease;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #1d2029; }
  tbody tr.selected { background: #232a3d; }
  tbody td { padding: 12px 16px; font-size: 14px; }
  td.desc { color: var(--muted); max-width: 360px; }
  td.check { width: 32px; text-align: center; }

  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .pill.common { background: rgba(138,143,152,0.15); color: var(--common); }
  .pill.uncommon { background: rgba(76,175,125,0.15); color: var(--uncommon); }
  .pill.rare { background: rgba(58,141,222,0.15); color: var(--rare); }
  .pill.legendary { background: rgba(217,166,65,0.15); color: var(--legendary); }

  .checkbox {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .footer {
    position: sticky;
    bottom: 0;
    margin-top: 24px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .footer .list {
    flex: 1;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    background: var(--accent);
    color: #0c0f14;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #3a3f4c;
    color: #777c88;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  #status {
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
  #status.error { color: #e57373; }
  #status.ok { color: #81c784; }

  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>

<h1>Rig Ultra Transaction</h1>
<p class="subtitle">Select exactly 5 songs. Confirming will generate a real ULTRA transaction containing exactly these songs, in this order, and redirect the visitor to the download page.</p>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Search songs…">
  <select id="rarityFilter">
    <option value="">All rarities</option>
    <option value="common">Common</option>
    <option value="uncommon">Uncommon</option>
    <option value="rare">Rare</option>
    <option value="legendary">Legendary</option>
  </select>
  <div class="selected-count"><strong id="selCount">0</strong> / 5 selected</div>
</div>

<table>
  <thead>
    <tr>
      <th class="check"></th>
      <th>Title</th>
      <th>Rarity</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody id="songRows"></tbody>
</table>

<div class="footer">
  <div class="list" id="selectionList">No songs selected yet.</div>
  <button class="secondary" id="clearBtn" type="button">Clear</button>
  <button id="confirmBtn" type="button" disabled>Confirm Rig</button>
</div>

<div id="status"></div>

<script>
let allSongs = [];
const selected = []; // ordered array of titles, max 5

const rowsEl = document.getElementById('songRows');
const searchBox = document.getElementById('searchBox');
const rarityFilter = document.getElementById('rarityFilter');
const selCount = document.getElementById('selCount');
const selectionList = document.getElementById('selectionList');
const confirmBtn = document.getElementById('confirmBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');

async function loadSongs() {
  try {
    const res = await fetch('/api/admin/songs');
    if (!res.ok) throw new Error('Failed to load songs (' + res.status + ')');
    allSongs = await res.json();
    render();
  } catch (err) {
    rowsEl.innerHTML = '';
    statusEl.textContent = err.message;
    statusEl.className = 'error';
  }
}

function toggleSong(title) {
  const idx = selected.indexOf(title);
  if (idx !== -1) {
    selected.splice(idx, 1);
  } else {
    if (selected.length >= 5) {
      statusEl.textContent = 'You can only select 5 songs. Deselect one first.';
      statusEl.className = 'error';
      return;
    }
    selected.push(title);
  }
  statusEl.textContent = '';
  statusEl.className = '';
  render();
}

function render() {
  const q = searchBox.value.trim().toLowerCase();
  const rarity = rarityFilter.value;

  const filtered = allSongs.filter(s => {
    if (rarity && s.rarity !== rarity) return false;
    if (q && !s.title.toLowerCase().includes(q)) return false;
    return true;
  });

  if (filtered.length === 0) {
    rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No songs match.</td></tr>';
  } else {
    rowsEl.innerHTML = filtered.map(s => {
      const isSelected = selected.includes(s.title);
      return `
        <tr class="${isSelected ? 'selected' : ''}" data-title="${escapeAttr(s.title)}">
          <td class="check"><input type="checkbox" class="checkbox" ${isSelected ? 'checked' : ''}></td>
          <td>${escapeHtml(s.title)}</td>
          <td><span class="pill ${s.rarity}">${s.rarity}</span></td>
          <td class="desc">${escapeHtml(s.description || '')}</td>
        </tr>
      `;
    }).join('');
  }

  Array.from(rowsEl.querySelectorAll('tr[data-title]')).forEach(tr => {
    tr.addEventListener('click', () => toggleSong(tr.dataset.title));
  });

  selCount.textContent = selected.length;
  selectionList.textContent = selected.length
    ? 'Selected (in order): ' + selected.join(' → ')
    : 'No songs selected yet.';
  confirmBtn.disabled = selected.length !== 5;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

searchBox.addEventListener('input', render);
rarityFilter.addEventListener('change', render);

clearBtn.addEventListener('click', () => {
  selected.length = 0;
  statusEl.textContent = '';
  statusEl.className = '';
  render();
});

confirmBtn.addEventListener('click', async () => {
  if (selected.length !== 5) return;
  confirmBtn.disabled = true;
  statusEl.textContent = 'Creating transaction…';
  statusEl.className = '';
  try {
    const res = await fetch('/api/admin/rig_confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ titles: selected })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      statusEl.textContent = 'Transaction created. Redirecting…';
      statusEl.className = 'ok';
      window.location.href = '/';
    } else {
      statusEl.textContent = data.error || 'Failed to create transaction.';
      statusEl.className = 'error';
      confirmBtn.disabled = selected.length !== 5;
    }
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'error';
    confirmBtn.disabled = selected.length !== 5;
  }
});

loadSongs();
</script>

</body>
</html>
